apiVersion: v1
kind: Secret
metadata:
  name: openai-credentials
type: Opaque
stringData:
  # OpenAI-compatible endpoint the workflows talk to (e.g. a LiteLLM proxy with a scoped virtual
  # key, Ollama, vLLM, or a hosted provider).
  OPENAI_BASE_URL: https://your-openai-compatible-host/v1
  # Scoped provider key. When using a LiteLLM proxy, provision a VIRTUAL KEY (model allowlist +
  # budget cap) - never use the proxy's master key, which carries key-management privileges.
  OPENAI_API_KEY: replace-with-a-secret
  # Required by the %prod profile: bearer key gating this app's /functions/* and workflow
  # endpoints. Generate one, e.g. `openssl rand -hex 24`.
  UTILITY_API_KEY: replace-with-a-secret
