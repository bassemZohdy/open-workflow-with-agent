apiVersion: sonataflow.org/v1alpha08
kind: SonataFlow
metadata:
  name: llm-tool-agent
  annotations:
    sonataflow.org/description: LLM Tool Agent delegating orchestration to an agent-loop subflow
    sonataflow.org/version: 1.0.0
    sonataflow.org/profile: gitops
spec:
  resources:
    configMaps:
      - configMap:
          name: llm-tool-agent-resources
        workflowPath: .
  flow:
    id: llm_tool_agent
    version: '1.0'
    specVersion: '0.8'
    name: LLM Tool Agent
    description: Public workflow entry point delegating to the reusable agent loop subflow
    start: Validate Request
    states:
      # Mirrors src/main/resources/llm-tool-agent.sw.yaml: server-side request guardrails live in
      # the workflow itself so they deploy with the workflow on OpenShift Serverless Logic.
      - name: Validate Request
        type: switch
        dataConditions:
          - condition: >-
              ${ ((.messages // []) | type == "array") and ((.messages | length) >= 1) and ((.messages | length) <= 20)
                 and all(.messages[]; ((.content // "") | type == "string") and ((.content // "" | length) <= 8192))
                 and all(.messages[]; (.role == "user") or (.role == "assistant"))
                 and ((.model // "default-model") as $m
                      | ["default-model", "llama3.1", "llama3.2", "llama3.3", "gpt-4o", "gpt-4o-mini", "claude-3-5-sonnet", "claude-3-5-haiku"]
                        | any(. == $m)) }
            transition: Run Agent Loop
        defaultCondition:
          transition: Invalid Request

      - name: Run Agent Loop
        type: operation
        actions:
          - name: Execute Agent Loop
            subFlowRef: agent_loop
            actionDataFilter:
              useResults: true
        end: true

      - name: Invalid Request
        type: inject
        data:
          error: >-
            request failed server-side validation: messages must be an array of 1-20 entries with
            string content of at most 8192 chars, roles limited to user|assistant, and model must be
            in the workflow allowlist
        end: true
  podTemplate:
    container:
      image: quay.io/example/llm-tool-agent:1.0.0
      env:
        - name: OPENAI_BASE_URL
          valueFrom:
            secretKeyRef:
              name: openai-credentials
              key: OPENAI_BASE_URL
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-credentials
              key: OPENAI_API_KEY
        # The %prod profile requires this key - provide it via the same secret (see
        # openai-credentials.example.yaml). On OpenShift, provision the LLM key as a scoped
        # LiteLLM virtual key rather than the master key (same model allowlist + budget cap
        # story as docker-compose's litellm-keygen service).
        - name: UTILITY_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-credentials
              key: UTILITY_API_KEY
