apiVersion: sonataflow.org/v1alpha08
kind: SonataFlow
metadata:
  name: llm-tool-agent
  annotations:
    sonataflow.org/description: YAML LLM tool loop using reusable OpenAPI resource catalogs
    sonataflow.org/version: 1.0.0
    sonataflow.org/profile: gitops
spec:
  flow:
    id: llm_tool_agent
    version: '1.0'
    specVersion: '0.8'
    name: LLM Tool Agent
    description: YAML-only LLM tool loop using reusable OpenAPI resource catalogs
    start: Inject Agent Defaults
    extensions:
      - extensionid: workflow-uri-definitions
        definitions:
          openaiCatalog: classpath:/catalogs/openai-compatible.yaml
          utilityCatalog: classpath:/catalogs/utility-functions.yaml
    functions:
      - name: openaiChatCompletion
        operation: openaiCatalog#chatCompletions
      - name: getCurrentTime
        operation: utilityCatalog#getCurrentTime
      - name: calculate
        operation: utilityCatalog#calculate
      - name: appendTimeToolResult
        type: expression
        operation: >-
          {messages: ((.messages | tojson | fromjson) + [{role: .choices[0].message.role,
          content: (.choices[0].message.content // null),
          tool_calls: (.choices[0].message.tool_calls | map(.function.arguments |= (if type == "string" then . else tojson end)))},
          {role: "tool", tool_call_id: .choices[0].message.tool_calls[0].id,
          name: "get_current_time", content: ({timezone: .timezone, datetime: .datetime} | tojson)}]),
          tool_iterations: (.tool_iterations + 1)}
      - name: appendCalculatorToolResult
        type: expression
        operation: >-
          {messages: ((.messages | tojson | fromjson) + [{role: .choices[0].message.role,
          content: (.choices[0].message.content // null),
          tool_calls: (.choices[0].message.tool_calls | map(.function.arguments |= (if type == "string" then . else tojson end)))},
          {role: "tool", tool_call_id: .choices[0].message.tool_calls[0].id,
          name: "calculate", content: ({expression: .expression, result: .result} | tojson)}]),
          tool_iterations: (.tool_iterations + 1)}
    states:
      - name: Inject Agent Defaults
        type: inject
        data:
          model: kimi-k2.5
          max_tool_iterations: 5
          tool_iterations: 0
          tools:
            - type: function
              function:
                name: get_current_time
                description: Get the current date and time for a timezone.
                parameters:
                  type: object
                  properties:
                    timezone:
                      type: string
                      description: IANA timezone such as UTC or Asia/Dubai.
                  required: [timezone]
            - type: function
              function:
                name: calculate
                description: Evaluate a basic arithmetic expression.
                parameters:
                  type: object
                  properties:
                    expression:
                      type: string
                      description: Arithmetic expression using numbers, parentheses, +, -, *, and /.
                  required: [expression]
        transition: Call LLM
      - name: Call LLM
        type: operation
        actions:
          - name: Generate Response
            functionRef:
              refName: openaiChatCompletion
              arguments:
                model: .model
                messages: .messages
                temperature: .temperature
                max_tokens: .max_tokens
                tools: .tools
        transition: Inspect LLM Response
      - name: Inspect LLM Response
        type: switch
        dataConditions:
          - condition: '${ (.choices[0].message.tool_calls // []) | length == 0 }'
            transition: Complete
          - condition: '${ .tool_iterations >= .max_tool_iterations }'
            transition: Tool Limit Reached
          - condition: '${ .choices[0].message.tool_calls[0].function.name == "get_current_time" }'
            transition: Execute Time Tool
          - condition: '${ .choices[0].message.tool_calls[0].function.name == "calculate" }'
            transition: Execute Calculator Tool
        defaultCondition:
          transition: Unsupported Tool
      - name: Execute Time Tool
        type: operation
        actions:
          - name: Get Current Time
            functionRef:
              refName: getCurrentTime
              arguments:
                timezone: '${ .choices[0].message.tool_calls[0].function.arguments | if type == "string" then fromjson else . end | .timezone }'
        transition: Append Time Tool Result
      - name: Append Time Tool Result
        type: operation
        actions:
          - name: Append Time Messages
            functionRef:
              refName: appendTimeToolResult
        transition: Call LLM
      - name: Execute Calculator Tool
        type: operation
        actions:
          - name: Calculate
            functionRef:
              refName: calculate
              arguments:
                expression: '${ .choices[0].message.tool_calls[0].function.arguments | if type == "string" then fromjson else . end | .expression }'
        transition: Append Calculator Tool Result
      - name: Append Calculator Tool Result
        type: operation
        actions:
          - name: Append Calculator Messages
            functionRef:
              refName: appendCalculatorToolResult
        transition: Call LLM
      - name: Complete
        type: inject
        data: {}
        end: true
      - name: Tool Limit Reached
        type: inject
        data:
          error: Maximum tool iterations reached
        end: true
      - name: Unsupported Tool
        type: inject
        data:
          error: Unsupported tool requested
        end: true
  podTemplate:
    container:
      image: quay.io/example/llm-tool-agent:1.0.0
      env:
        - name: LITELLM_BASE_URL
          valueFrom:
            secretKeyRef:
              name: litellm-credentials
              key: LITELLM_BASE_URL
        - name: LITELLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-credentials
              key: LITELLM_API_KEY
