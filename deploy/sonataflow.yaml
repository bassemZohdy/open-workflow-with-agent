apiVersion: sonataflow.org/v1alpha08
kind: SonataFlow
metadata:
  name: llm-tool-agent
  annotations:
    sonataflow.org/description: LLM Tool Agent delegating orchestration to an agent-loop subflow
    sonataflow.org/version: 1.0.0
    sonataflow.org/profile: gitops
spec:
  resources:
    configMaps:
      - configMap:
          name: llm-tool-agent-resources
        workflowPath: .
  flow:
    id: llm_tool_agent
    version: '1.0'
    specVersion: '0.8'
    name: LLM Tool Agent
    description: Public workflow entry point delegating to the reusable agent loop subflow
    start: Run Agent Loop
    states:
      - name: Run Agent Loop
        type: operation
        actions:
          - name: Execute Agent Loop
            subFlowRef: agent_loop
            actionDataFilter:
              useResults: true
        end: true
  podTemplate:
    container:
      image: quay.io/example/llm-tool-agent:1.0.0
      env:
        - name: OPENAI_BASE_URL
          valueFrom:
            secretKeyRef:
              name: openai-credentials
              key: OPENAI_BASE_URL
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-credentials
              key: OPENAI_API_KEY

