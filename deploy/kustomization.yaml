apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - sonataflow.yaml
configMapGenerator:
  - name: llm-tool-agent-resources
    files:
      - agent-loop.sw.yaml=../src/main/resources/agent-loop.sw.yaml
      - tool-executor.sw.yaml=../src/main/resources/tool-executor.sw.yaml
      - hitl-gate.sw.yaml=../src/main/resources/hitl-gate.sw.yaml
      - parallel-agent.sw.yaml=../src/main/resources/parallel-agent.sw.yaml
      - reflection-agent.sw.yaml=../src/main/resources/reflection-agent.sw.yaml
      - plan-agent.sw.yaml=../src/main/resources/plan-agent.sw.yaml
      - chain-agent.sw.yaml=../src/main/resources/chain-agent.sw.yaml
      - supervisor-agent.sw.yaml=../src/main/resources/supervisor-agent.sw.yaml
