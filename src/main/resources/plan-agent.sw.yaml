id: plan_agent
version: '1.0'
specVersion: '0.8'
name: Planning Agent
description: Reusable sub-flow for dynamic goal decomposition, step-by-step task planning, and execution
start: Decompose Goal

extensions:
  - extensionid: workflow-uri-definitions
    definitions:
      plannerCatalog: classpath:/catalogs/planner-catalog.yaml

functions:
  - name: decomposeGoal
    operation: plannerCatalog#decomposeGoal

states:
  - name: Decompose Goal
    type: operation
    actions:
      - name: Generate Plan
        functionRef:
          refName: decomposeGoal
          arguments:
            goal: '${ .goal // "Build and verify agent workflow" }'
        actionDataFilter:
          toStateData: '.execution_plan'
    transition: Execute Plan Step

  - name: Execute Plan Step
    type: operation
    actions:
      - name: Delegate Subflow Execution
        subFlowRef: agent_loop
        actionDataFilter:
          useResults: true
    transition: Complete Planning

  - name: Complete Planning
    type: inject
    data:
      status: completed
      planning_summary: Goal successfully decomposed and executed
    end: true
