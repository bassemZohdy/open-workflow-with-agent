id: chain_agent
version: '1.0'
specVersion: '0.8'
name: Sequential Chain Agent
description: Reusable sub-flow for sequential multi-agent chaining pipeline (Researcher -> Coder -> Reviewer)
start: Step 1 Research

extensions:
  - extensionid: workflow-uri-definitions
    definitions:
      a2aCatalog: classpath:/catalogs/a2a-catalog.yaml

functions:
  - name: delegateToAgent
    operation: a2aCatalog#delegateToAgent

states:
  - name: Step 1 Research
    type: operation
    actions:
      - name: Execute Researcher
        functionRef:
          refName: delegateToAgent
          arguments:
            target_agent: researcher_agent
            prompt: '${ .prompt // "Perform initial research" }'
        actionDataFilter:
          toStateData: '.step1_output'
    transition: Step 2 Code Generation

  - name: Step 2 Code Generation
    type: operation
    actions:
      - name: Execute Coder
        functionRef:
          refName: delegateToAgent
          arguments:
            target_agent: coder_agent
            prompt: '${ .step1_output.delegation_result }'
        actionDataFilter:
          toStateData: '.step2_output'
    transition: Step 3 Review

  - name: Step 3 Review
    type: operation
    actions:
      - name: Execute Reviewer
        functionRef:
          refName: delegateToAgent
          arguments:
            target_agent: reviewer_agent
            prompt: '${ .step2_output.delegation_result }'
        actionDataFilter:
          toStateData: '.step3_output'
    transition: Complete Chain

  - name: Complete Chain
    type: inject
    data:
      status: completed
      chain_summary: Sequential multi-agent pipeline executed successfully
    end: true
