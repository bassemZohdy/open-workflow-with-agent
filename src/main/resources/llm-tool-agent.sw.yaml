id: llm_tool_agent
version: '1.0'
specVersion: '0.8'
name: LLM Tool Agent
description: Public workflow entry point delegating to the reusable agent loop subflow
start: Validate Request

# Server-side request guardrails enforced here, in the workflow itself, so they travel with the
# workflow when deployed to OpenShift Serverless Logic (no Java/config needed on the platform):
#   * messages: array of 1..20 entries, each content a string of at most 8192 chars
#   * roles:   only "user" and "assistant" are accepted - callers cannot inject role:"system"
#              prompts through the public entry point
#   * model:   must be in the allowlist below (edit this list to expose other models/aliases)
# Deeper clamps (max_tokens <= 4096, message truncation) are applied defensively inside the
# agent_loop subflow itself, since that subflow is also reachable from plan_agent.

states:
  - name: Validate Request
    type: switch
    dataConditions:
      - condition: >-
          ${ ((.messages // []) | type == "array") and ((.messages | length) >= 1) and ((.messages | length) <= 20)
             and all(.messages[]; ((.content // "") | type == "string") and ((.content // "" | length) <= 8192))
             and all(.messages[]; (.role == "user") or (.role == "assistant"))
             and ((.model // "default-model") as $m
                  | ["default-model", "llama3.1", "llama3.2", "llama3.3", "gpt-4o", "gpt-4o-mini", "claude-3-5-sonnet", "claude-3-5-haiku"]
                    | any(. == $m)) }
        transition: Run Agent Loop
    defaultCondition:
      transition: Invalid Request

  - name: Run Agent Loop
    type: operation
    actions:
      - name: Execute Agent Loop
        subFlowRef: agent_loop
        actionDataFilter:
          useResults: true
    end: true

  - name: Invalid Request
    type: inject
    data:
      error: >-
        request failed server-side validation: messages must be an array of 1-20 entries with
        string content of at most 8192 chars, roles limited to user|assistant, and model must be
        in the workflow allowlist
    end: true
