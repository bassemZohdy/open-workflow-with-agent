id: llm_tool_agent
version: '1.0'
specVersion: '0.8'
name: LLM Tool Agent
description: Public workflow entry point delegating to the reusable agent loop subflow
start: Run Agent Loop

states:
  - name: Run Agent Loop
    type: operation
    actions:
      - name: Execute Agent Loop
        subFlowRef: agent_loop
        actionDataFilter:
          useResults: true
    end: true
