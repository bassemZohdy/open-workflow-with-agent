# Enable a local container image build with: mvn -Dcontainer package
%container.quarkus.container-image.build=true
%container.quarkus.container-image.push=false
%container.quarkus.container-image.tag=1.0.0-SNAPSHOT

# OpenAI-compatible catalog endpoint and bearer credential. The bearer token is applied by
# OpenAiBearerTokenFilter (see that class for why quarkus-openapi-generator's own auth wiring
# doesn't work here) rather than quarkus.openapi-generator.*.auth.* config.
quarkus.rest-client.openaiCatalog.url=${OPENAI_BASE_URL:http://localhost:4000/v1}
quarkus.rest-client.openaiCatalog.providers=org.acme.functions.OpenAiBearerTokenFilter
openai.api-key=${OPENAI_API_KEY:dummy-key}
quarkus.rest-client.openaiCatalog.connect-timeout=10000
quarkus.rest-client.openaiCatalog.read-timeout=120000

# External agent REST catalog (catalogs/agent-rest.yaml). Defaults to this application's
# own bundled mock agent (same port), so the sync/async demos work out of the box. Point
# AGENT_BASE_URL at any agent implementing the contract to integrate a real one.
quarkus.rest-client.agentCatalog.url=${AGENT_BASE_URL:http://localhost:8080}
quarkus.rest-client.agentCatalog.connect-timeout=5000
quarkus.rest-client.agentCatalog.read-timeout=30000
# Optional bearer credential for an external agent API. The client filter only falls back to
# UTILITY_API_KEY when the resolved target has the same origin as this application; it never
# sends the front-door key to a third-party AGENT_BASE_URL.
quarkus.rest-client.agentCatalog.providers=org.acme.functions.AgentBearerTokenFilter
agent.api-key=${AGENT_API_KEY:}

# Callback SSRF protection. Development/test allow the bundled local mock target; production
# requires an explicit AGENT_CALLBACK_ALLOWED_HOSTS entry for any private/internal destination.
agent.callback.allowed-hosts=${AGENT_CALLBACK_ALLOWED_HOSTS:}
%dev.agent.callback.allowed-hosts=${AGENT_CALLBACK_ALLOWED_HOSTS:localhost,127.0.0.1,::1}
%test.agent.callback.allowed-hosts=${AGENT_CALLBACK_ALLOWED_HOSTS:localhost,127.0.0.1,::1}
agent.callback.connect-timeout=${AGENT_CALLBACK_CONNECT_TIMEOUT:5s}
agent.callback.request-timeout=${AGENT_CALLBACK_REQUEST_TIMEOUT:10s}
agent.callback.attempts=${AGENT_CALLBACK_ATTEMPTS:5}
agent.callback.retry-delay=${AGENT_CALLBACK_RETRY_DELAY:500ms}

# Incoming CloudEvent channel that resumes workflows suspended in a callback state. The
# agent_call async mode instructs the agent (via callback_url) to POST its agent_response
# CloudEvent here; correlation back to the suspended instance is done through the event's
# kogitoprocrefid extension attribute. The quarkus-http connector ships with sonataflow-quarkus.
# IMPORTANT: the channel key ("agent_response") must equal the workflow event definition's
# TYPE - SonataFlow generates the message trigger against that name (see ProcessCodegen
# "Skipping trigger ... channelName=agent_response" when they diverge).
mp.messaging.incoming.agent_response.connector=quarkus-http
mp.messaging.incoming.agent_response.path=/agent/response-event

# The application does not use Keycloak. Disable Quarkus Keycloak Dev Services in tests so
# the suite remains deterministic and does not require pulling an external container image.
%test.quarkus.keycloak.devservices.enabled=false

# In @QuarkusTest the application under test binds HTTP to 8081; the agent catalog must
# resolve to that port so agent_call reaches the bundled mock agent in the same instance.
%test.quarkus.rest-client.agentCatalog.url=http://localhost:8081

# Optional bearer API key gating every agent and workflow endpoint (except /q/* management
# endpoints). Leave unset to disable auth entirely in dev/test; non-development profiles
# fail fast when it is missing.
utility.api-key=${UTILITY_API_KEY:}
# In the %prod profile (which is what the container image and OpenShift Serverless Logic run) auth
# and rate limiting are ENABLED BY DEFAULT: ProdSecurityDefaults refuses to start when
# UTILITY_API_KEY is blank, and a sane global rate cap applies unless overridden.
%prod.utility.api-key=${UTILITY_API_KEY:}
%prod.utility.rate-limit.requests-per-minute=${UTILITY_RATE_LIMIT_REQUESTS_PER_MINUTE:600}

# Global request-rate cap (fixed 60s window). Secure by default for packaged/custom profiles;
# development and tests remain convenient unless explicitly overridden.
utility.rate-limit.requests-per-minute=${UTILITY_RATE_LIMIT_REQUESTS_PER_MINUTE:600}
%dev.utility.rate-limit.requests-per-minute=${UTILITY_RATE_LIMIT_REQUESTS_PER_MINUTE:0}
%test.utility.rate-limit.requests-per-minute=${UTILITY_RATE_LIMIT_REQUESTS_PER_MINUTE:0}

# Studio reads canonical source only from this configured repository root. The local default
# keeps the reference application useful when launched from the repository; production
# deployments should set STUDIO_WORKSPACE_ROOT explicitly.
studio.workspace.root=${STUDIO_WORKSPACE_ROOT:.}
# Studio writes are an explicit capability. Development and test profiles remain convenient;
# packaged/custom profiles require STUDIO_WRITE_ENABLED=true to opt into mutation.
studio.write-enabled=${STUDIO_WRITE_ENABLED:false}
%dev.studio.write-enabled=${STUDIO_WRITE_ENABLED:true}
%test.studio.write-enabled=${STUDIO_WRITE_ENABLED:true}
%prod.studio.write-enabled=${STUDIO_WRITE_ENABLED:false}
studio.allowed-origins=${STUDIO_ALLOWED_ORIGINS:}
studio.runtime-validation.enabled=${STUDIO_RUNTIME_VALIDATION_ENABLED:false}
%dev.studio.runtime-validation.enabled=${STUDIO_RUNTIME_VALIDATION_ENABLED:true}
%test.studio.runtime-validation.enabled=${STUDIO_RUNTIME_VALIDATION_ENABLED:true}
studio.runtime-validation.timeout=${STUDIO_RUNTIME_VALIDATION_TIMEOUT:10s}
studio.runtime-validation.max-concurrency=${STUDIO_RUNTIME_VALIDATION_MAX_CONCURRENCY:1}
studio.runtime-validation.max-output-bytes=${STUDIO_RUNTIME_VALIDATION_MAX_OUTPUT_BYTES:65536}

# Apply Studio browser headers at the HTTP layer so they also cover Quarkus static-resource
# responses that bypass JAX-RS resource/response filters.
quarkus.http.filter.studio-security.matches=/studio(/.*)?
quarkus.http.filter.studio-security.methods=GET,HEAD
quarkus.http.filter.studio-security.header."Content-Security-Policy"=default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'
quarkus.http.filter.studio-security.header."X-Content-Type-Options"=nosniff
quarkus.http.filter.studio-security.header."Referrer-Policy"=same-origin

# Persist workflow and agent diagnostics locally. The path is relative to the application working directory.
quarkus.log.file.enabled=true
quarkus.log.file.path=logs/application.log
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5
quarkus.log.category."org.acme.functions".level=INFO
