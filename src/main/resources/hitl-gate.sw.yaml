id: hitl_gate
version: '1.0'
specVersion: '0.8'
name: HITL Gate
description: Reusable sub-flow for human-in-the-loop approval gating
start: Request Human Approval

extensions:
  - extensionid: workflow-uri-definitions
    definitions:
      hitlCatalog: classpath:/catalogs/hitl-catalog.yaml

functions:
  - name: requestApproval
    operation: hitlCatalog#requestApproval

states:
  - name: Request Human Approval
    type: operation
    actions:
      - name: Create Approval Request
        functionRef:
          refName: requestApproval
          arguments:
            action_name: '${ .action_name // "sensitive_action" }'
            description: '${ .description // "Human approval required for action" }'
        actionDataFilter:
          toStateData: '.approval_result'
    transition: Evaluate Approval

  - name: Evaluate Approval
    type: switch
    dataConditions:
      - condition: '${ .approval_result.status == "approved" }'
        transition: Approval Granted
    defaultCondition:
      transition: Approval Denied

  - name: Approval Granted
    type: inject
    data:
      approval_granted: true
    end: true

  - name: Approval Denied
    type: inject
    data:
      approval_granted: false
      error: Human approval denied or pending
    end: true
