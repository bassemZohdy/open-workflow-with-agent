id: reflection_agent
version: '1.0'
specVersion: '0.8'
name: Self Reflection Agent
description: Reusable sub-flow for recursive generation, critique, and self-reflection loops
start: Initialize Reflection State

extensions:
  - extensionid: workflow-uri-definitions
    definitions:
      guardrailsCatalog: classpath:/catalogs/guardrails-catalog.yaml
      a2aCatalog: classpath:/catalogs/a2a-catalog.yaml

functions:
  - name: validateOutput
    operation: guardrailsCatalog#validateOutput
  - name: delegateToAgent
    operation: a2aCatalog#delegateToAgent

states:
  - name: Initialize Reflection State
    type: inject
    data:
      reflection_iteration: 0
      max_reflection_iterations: 3
    transition: Generate Candidate Answer

  - name: Generate Candidate Answer
    type: operation
    actions:
      - name: Generate Content
        functionRef:
          refName: delegateToAgent
          arguments:
            target_agent: coder_agent
            prompt: '${ .prompt // "Generate optimal solution" }'
        actionDataFilter:
          toStateData: '.candidate_response'
    transition: Critique Answer

  - name: Critique Answer
    type: operation
    actions:
      - name: Validate Candidate
        functionRef:
          refName: validateOutput
          arguments:
            content: '${ .candidate_response.delegation_result }'
        actionDataFilter:
          toStateData: '.critique_result'
    transition: Evaluate Critique

  - name: Evaluate Critique
    type: switch
    dataConditions:
      - condition: '${ .critique_result.valid == true }'
        transition: Complete Reflection
      - condition: '${ .reflection_iteration >= .max_reflection_iterations }'
        transition: Reflection Max Limit Reached
    defaultCondition:
      transition: Increment Reflection Iteration

  - name: Increment Reflection Iteration
    type: inject
    data:
      reflection_iteration: '${ .reflection_iteration + 1 }'
    transition: Generate Candidate Answer

  - name: Complete Reflection
    type: inject
    data:
      status: completed
      final_reflection_output: '${ .candidate_response }'
    end: true

  - name: Reflection Max Limit Reached
    type: inject
    data:
      status: completed_with_warnings
      error: Maximum self-reflection critique iterations reached
    end: true
