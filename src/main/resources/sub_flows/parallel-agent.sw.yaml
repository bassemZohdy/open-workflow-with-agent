id: parallel_agent
version: '1.0'
specVersion: '0.8'
name: Parallel Agent Fan-Out
description: Reusable sub-flow for concurrent fan-out task execution across multi-agent sub-flows
start: Fan Out Tasks

extensions:
  - extensionid: workflow-uri-definitions
    definitions:
      a2aCatalog: classpath:/catalogs/a2a-catalog.yaml

functions:
  - name: delegateToAgent
    operation: a2aCatalog#delegateToAgent

states:
  - name: Fan Out Tasks
    type: parallel
    completionType: allOf
    branches:
      - name: Research Task
        actions:
          - name: Execute Researcher
            functionRef:
              refName: delegateToAgent
              arguments:
                target_agent: researcher_agent
                prompt: '${ .prompt // "Conduct technical research" }'
            actionDataFilter:
              toStateData: '.research_result'
      - name: Coding Task
        actions:
          - name: Execute Coder
            functionRef:
              refName: delegateToAgent
              arguments:
                target_agent: coder_agent
                prompt: '${ .prompt // "Generate code implementation" }'
            actionDataFilter:
              toStateData: '.coder_result'
      - name: Review Task
        actions:
          - name: Execute Reviewer
            functionRef:
              refName: delegateToAgent
              arguments:
                target_agent: reviewer_agent
                prompt: '${ .prompt // "Perform code and architecture review" }'
            actionDataFilter:
              toStateData: '.reviewer_result'
    transition: Consolidate Results

  - name: Consolidate Results
    type: inject
    data:
      status: completed
      parallel_summary: Parallel multi-agent fan-out execution finished successfully
    end: true
