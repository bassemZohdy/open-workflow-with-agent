openapi: 3.0.3
info:
  title: Model Context Protocol (MCP) Catalog
  version: '1.0.0'
  description: Reusable OpenAPI catalog for Model Context Protocol (MCP) tool discovery and execution.
servers:
  - url: /
paths:
  /functions/mcp/call:
    post:
      operationId: callMcpTool
      summary: Execute a Model Context Protocol tool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                arguments:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: MCP tool execution result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
