openapi: 3.0.3
info:
  title: Agent Planning & Task Decomposition Catalog
  version: '1.0.0'
  description: Reusable OpenAPI catalog for breaking complex goals into structured sub-tasks.
servers:
  - url: /
paths:
  /functions/planner/decompose:
    post:
      operationId: decomposeGoal
      summary: Decompose high-level goal into ordered sub-task plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goal]
              properties:
                goal:
                  type: string
      responses:
        '200':
          description: Decomposed task plan
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
