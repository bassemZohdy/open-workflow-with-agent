openapi: 3.0.3
info:
  title: Agent Short & Long Term Memory Catalog
  version: '1.0.0'
  description: Reusable OpenAPI catalog for agent context storage, key-value memory retrieval, and vector memory search.
servers:
  - url: /
paths:
  /functions/memory/get:
    get:
      operationId: getMemory
      summary: Retrieve a value from agent memory by key
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Memory retrieval result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /functions/memory/set:
    post:
      operationId: setMemory
      summary: Store a key-value entry in agent memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                value:
                  type: string
      responses:
        '200':
          description: Memory store result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /functions/memory/search:
    post:
      operationId: searchMemory
      summary: Perform semantic vector search over agent memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                top_k:
                  type: integer
                  default: 3
      responses:
        '200':
          description: Memory search results
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
