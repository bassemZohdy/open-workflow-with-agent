name: Agentic OpenWorkflow CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-studio:
    name: Studio frontend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend/studio/package-lock.json

      - name: Install locked Studio dependencies
        working-directory: frontend/studio
        run: npm ci

      - name: Check Studio formatting
        working-directory: frontend/studio
        run: npm run format:check

      - name: Lint Studio
        working-directory: frontend/studio
        run: npm run lint

      - name: Typecheck Studio
        working-directory: frontend/studio
        run: npm run typecheck

      - name: Test Studio
        working-directory: frontend/studio
        run: npm run test:unit -- --run

      - name: Build Studio production assets
        working-directory: frontend/studio
        run: npm run build

  test:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run test suite
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Package application
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

      - name: Verify packaged Studio bundle
        run: bash scripts/check-studio-bundle.sh

      - name: Verify validation profile alignment
        run: bash scripts/check-validation-profile.sh

      - name: Upload packaged application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quarkus-app
          path: target/quarkus-app/
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maven-test-reports
          path: |
            target/surefire-reports/
          if-no-files-found: ignore

  validate-deployment:
    name: Validate deployment manifests
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The SonataFlow CR embeds the primary workflow in spec.flow; it is
      # regenerated from workflows/agent-call.sw.yaml (single source of truth).
      # Fail the build if the committed CR drifted from the canonical spec.
      - name: Verify sonataflow.yaml is generated from the canonical workflows
        run: ./deploy/generate-sonataflow.sh --check

      # Kogito discovers workflows only under src/main/resources, so the runner
      # keeps a generated mirror of the canonical workflows/ package there.
      # Fail the build if the mirror drifted from the canonical specs.
      - name: Verify runner resources mirror the canonical workflows
        run: ./deploy/sync-runner-resources.sh --check

      - name: Validate Kustomize package
        run: >
          kubectl kustomize deploy --load-restrictor
          LoadRestrictionsNone >/dev/null

      - name: Validate Docker Compose configuration
        run: ./deploy/validate-compose.sh

  container:
    name: Build container image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Docker image
        run: >
          docker build --file Dockerfile
          --tag llm-tool-agent:${{ github.sha }} .

      - name: Inspect Docker image
        run: docker image inspect llm-tool-agent:${{ github.sha }}

  e2e:
    name: Playwright E2E tests
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Download packaged application
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: quarkus-app
          path: target/quarkus-app

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E suite (Playwright starts the packaged app)
        working-directory: e2e
        env:
          CI: "true"
          PLAYWRIGHT_API_KEY: e2e-ci-key
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore

  security:
    name: Security scans (Trivy, gitleaks, OWASP dependency-check)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run Trivy vulnerability scanner (repo, dependencies, Dockerfile)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          # Pin the Trivy binary: the 0.70.0 action default misbehaves here
          # (exit 1 with zero HIGH/CRITICAL findings); 0.74.0 is the locally
          # verified version (see TODO.md).
          version: v0.74.0
          # Without this, the action UNSETS the severity filter for SARIF output
          # ("Building SARIF report with all severities"), so exit-code fires on
          # MEDIUM/LOW findings too. With it, only HIGH/CRITICAL are scanned,
          # reported, and gated on.
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-results.sarif

      - name: Run gitleaks secrets scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # dependency-check without an NVD API key gets rate-limited by the NVD API
      # and can hang/fail spuriously, so only run it when the key is configured
      # (repo Settings -> Secrets and variables -> Actions -> NVD_API_KEY).
      - name: Run OWASP dependency-check (blocking on CVSS >= 7)
        if: env.NVD_API_KEY != ''
        run: >
          mvn --batch-mode --no-transfer-progress
          org.owasp:dependency-check-maven:13.0.0:check -DskipTests
          -DfailBuildOnCVSS=7
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY

      - name: Report skipped OWASP dependency-check
        if: env.NVD_API_KEY == ''
        run: echo "::warning::OWASP dependency-check skipped because NVD_API_KEY is not configured"
