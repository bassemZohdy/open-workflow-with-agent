name: Agentic OpenWorkflow CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Test & Validate Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and execute test suite
        run: mvn clean test --batch-mode

      - name: Build Docker Container Image
        run: docker build . --file Dockerfile --tag llm-tool-agent:latest
