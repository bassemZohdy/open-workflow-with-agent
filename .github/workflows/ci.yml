name: Agentic OpenWorkflow CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run test suite
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Package application
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  validate-deployment:
    name: Validate deployment manifests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Kustomize package
        run: kubectl kustomize deploy --load-restrictor LoadRestrictionsNone >/dev/null

  container:
    name: Build container image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --file Dockerfile --tag llm-tool-agent:${{ github.sha }} .

      - name: Inspect Docker image
        run: docker image inspect llm-tool-agent:${{ github.sha }}
