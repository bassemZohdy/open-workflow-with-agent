services:
  # Agentic OpenWorkflow Container Service
  openworkflow-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-tool-agent:latest
    container_name: openworkflow-agent
    ports:
      - "8080:8080"
    environment:
      # Generic OpenAI-compatible endpoint. Defaults to the local LiteLLM proxy below, which
      # routes to Ollama - point this at any other OpenAI-compatible provider instead and the
      # application code/workflows need no changes.
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://litellm:4000/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-local-dev}
      - UTILITY_API_KEY=${UTILITY_API_KEY:-}
      - UTILITY_RATE_LIMIT_REQUESTS_PER_MINUTE=${UTILITY_RATE_LIMIT_REQUESTS_PER_MINUTE:-0}
      # PostgreSQL SonataFlow Persistence
      - QUARKUS_DATASOURCE_DB_KIND=postgresql
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/openworkflow_db
      - QUARKUS_DATASOURCE_USERNAME=${POSTGRES_USER:-openworkflow}
      - QUARKUS_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-openworkflow_secret}
      # Redis Agent Short-Term Memory & Caching
      - QUARKUS_REDIS_HOSTS=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_started
    restart: unless-stopped

  # PostgreSQL Service (Workflow State Persistence)
  postgres:
    image: postgres:16-alpine
    container_name: openworkflow-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=openworkflow_db
      - POSTGRES_USER=${POSTGRES_USER:-openworkflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-openworkflow_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openworkflow} -d openworkflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Service (Agent Short-Term Memory & Cache)
  redis:
    image: redis:7-alpine
    container_name: openworkflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Local model runtime. Swappable: point OPENAI_BASE_URL/LiteLLM at any other OpenAI-compatible
  # provider (vLLM, a hosted API, etc.) instead - this service exists purely for a self-contained
  # local test stack.
  ollama:
    image: ollama/ollama:latest
    container_name: openworkflow-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot job pulling the configured model into the ollama service on first start.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: openworkflow-ollama-pull
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.1}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # Generic OpenAI-compatible proxy in front of Ollama (or any other provider - see
  # litellm-config.yaml). This is the single integration point the workflows talk to via
  # OPENAI_BASE_URL/OPENAI_API_KEY; swap the model_list in litellm-config.yaml to repoint
  # "default-model" at a different backend without touching any workflow YAML.
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: openworkflow-litellm
    ports:
      - "4000:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-local-dev}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ollama_data:
