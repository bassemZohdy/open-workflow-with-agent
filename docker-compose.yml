services:
  # Agentic OpenWorkflow Container Service
  openworkflow-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-tool-agent:latest
    container_name: openworkflow-agent
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Generic OpenAI-compatible endpoint. Defaults to the local LiteLLM proxy below, which
      # routes to Ollama - point this at any other OpenAI-compatible provider instead and the
      # application code/workflows need no changes.
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://litellm:4000/v1}
      # The app authenticates to LiteLLM with a scoped VIRTUAL KEY generated by the litellm-keygen
      # service and mounted at /keys/openai_api_key (see docker-entrypoint.sh). Set OPENAI_API_KEY
      # explicitly only when OPENAI_BASE_URL points at an external provider instead.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Required: the %prod profile (used by the container image) refuses to start without a key,
      # and rate limiting is enabled by default (600 req/min) - override to tune.
      - UTILITY_API_KEY=${UTILITY_API_KEY:?set UTILITY_API_KEY in .env}
      - UTILITY_RATE_LIMIT_REQUESTS_PER_MINUTE=${UTILITY_RATE_LIMIT_REQUESTS_PER_MINUTE:-600}
      # PostgreSQL SonataFlow Persistence
      - QUARKUS_DATASOURCE_DB_KIND=postgresql
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/openworkflow_db
      - QUARKUS_DATASOURCE_USERNAME=${OPENWORKFLOW_DB_USER:-openworkflow_app}
      - QUARKUS_DATASOURCE_PASSWORD=${OPENWORKFLOW_DB_PASSWORD:?set OPENWORKFLOW_DB_PASSWORD in .env}
      # External agent REST API (catalogs/agent-rest.yaml). Defaults to this container's own
      # bundled mock agent; point AGENT_BASE_URL at a real agent to integrate one.
      - AGENT_BASE_URL=${AGENT_BASE_URL:-http://localhost:8080}
      - AGENT_API_KEY=${AGENT_API_KEY:-}
      - AGENT_CALLBACK_ALLOWED_HOSTS=${AGENT_CALLBACK_ALLOWED_HOSTS:-}
    volumes:
      - litellm_keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      postgres-bootstrap:
        condition: service_completed_successfully
      litellm-keygen:
        condition: service_completed_successfully
    restart: unless-stopped

  # PostgreSQL Service (Workflow State Persistence)
  postgres:
    image: postgres:16.15-alpine
    container_name: openworkflow-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=openworkflow_db
      # This is a bootstrap administrator only. Runtime services use the dedicated roles
      # created by postgres-bootstrap and never receive this password.
      - POSTGRES_USER=${POSTGRES_USER:-openworkflow_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openworkflow_admin} -d openworkflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Idempotently provisions least-privilege runtime roles and database ownership on every
  # compose start. This also upgrades an existing postgres_data volume without requiring a
  # destructive `docker compose down -v`.
  postgres-bootstrap:
    image: postgres:16.15-alpine
    container_name: openworkflow-postgres-bootstrap
    environment:
      - POSTGRES_ADMIN_USER=${POSTGRES_USER:-openworkflow_admin}
      - POSTGRES_ADMIN_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - OPENWORKFLOW_DB_NAME=openworkflow_db
      - OPENWORKFLOW_DB_USER=${OPENWORKFLOW_DB_USER:-openworkflow_app}
      - OPENWORKFLOW_DB_PASSWORD=${OPENWORKFLOW_DB_PASSWORD:?set OPENWORKFLOW_DB_PASSWORD in .env}
      - LITELLM_DB_NAME=litellm_db
      - LITELLM_DB_USER=${LITELLM_DB_USER:-litellm}
      - LITELLM_DB_PASSWORD=${LITELLM_DB_PASSWORD:?set LITELLM_DB_PASSWORD in .env}
    volumes:
      - ./postgres-init/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Local model runtime. Swappable: point OPENAI_BASE_URL/LiteLLM at any other OpenAI-compatible
  # provider (vLLM, a hosted API, etc.) instead - this service exists purely for a self-contained
  # local test stack.
  ollama:
    image: ollama/ollama:0.32.13
    container_name: openworkflow-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot job pulling the configured model into the ollama service on first start.
  ollama-pull:
    image: ollama/ollama:0.32.13
    container_name: openworkflow-ollama-pull
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.1}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # Generic OpenAI-compatible proxy in front of Ollama (or any other provider - see
  # litellm-config.yaml). This is the single integration point the workflows talk to via
  # OPENAI_BASE_URL/OPENAI_API_KEY; swap the model_list in litellm-config.yaml to repoint
  # "default-model" at a different backend without touching any workflow YAML.
  litellm:
    image: ghcr.io/berriai/litellm:v1.96.2
    container_name: openworkflow-litellm
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      # Postgres-backed key management (virtual keys + spend tracking); LiteLLM receives only
      # its dedicated database role, never the bootstrap administrator credentials.
      - DATABASE_URL=postgresql://${LITELLM_DB_USER:-litellm}:${LITELLM_DB_PASSWORD:?set LITELLM_DB_PASSWORD in .env}@postgres:5432/litellm_db
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
      postgres-bootstrap:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot job that provisions a SCOPED LiteLLM virtual key (model allowlist = [default-model],
  # budget cap = $5.0) and writes it to the shared litellm_keys volume, which the agent container
  # reads at startup. The application therefore never authenticates to the proxy with the master
  # key, and never holds key-management/spend privileges.
  litellm-keygen:
    image: curlimages/curl:8.21.0
    container_name: openworkflow-litellm-keygen
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
    volumes:
      - litellm_keys:/keys
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -s /keys/openai_api_key ]; then
          echo "Existing scoped virtual key found; reusing it"
          exit 0
        fi
        echo "Waiting for LiteLLM proxy at http://litellm:4000 ..."
        until curl -fsS http://litellm:4000/health/liveliness >/dev/null 2>&1; do sleep 2; done
        echo "Generating scoped virtual key (models=[default-model], max_budget=5.0) ..."
        curl -fsS -X POST http://litellm:4000/key/generate \
          -H "Authorization: Bearer $$LITELLM_MASTER_KEY" \
          -H "Content-Type: application/json" \
          -d '{"models":["default-model"],"max_budget":5.0,"metadata":{"purpose":"openworkflow-agent"}}' \
          > /tmp/keygen.json
        KEY=$$(sed -n 's/.*"key":"\(sk-[^"]*\)".*/\1/p' /tmp/keygen.json | head -1)
        if [ -z "$$KEY" ]; then
          echo "Failed to generate virtual key:"; cat /tmp/keygen.json; exit 1
        fi
        printf '%s' "$$KEY" > /keys/.openai_api_key.tmp
        mv /keys/.openai_api_key.tmp /keys/openai_api_key
        echo "Virtual key written to /keys/openai_api_key"
    depends_on:
      litellm:
        condition: service_started
    restart: "no"

volumes:
  postgres_data:
  ollama_data:
  litellm_keys:
