version: '3.8'

services:
  # Agentic OpenWorkflow Container Service
  openworkflow-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-tool-agent:latest
    container_name: openworkflow-agent
    ports:
      - "8080:8080"
    environment:
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://localhost:4000/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy-key}
      # PostgreSQL SonataFlow Persistence
      - QUARKUS_DATASOURCE_DB_KIND=postgresql
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/openworkflow_db
      - QUARKUS_DATASOURCE_USERNAME=openworkflow
      - QUARKUS_DATASOURCE_PASSWORD=openworkflow_secret
      # Redis Agent Short-Term Memory & Caching
      - QUARKUS_REDIS_HOSTS=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # PostgreSQL Service (Workflow State Persistence)
  postgres:
    image: postgres:16-alpine
    container_name: openworkflow-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=openworkflow_db
      - POSTGRES_USER=openworkflow
      - POSTGRES_PASSWORD=openworkflow_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openworkflow -d openworkflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Service (Agent Short-Term Memory & Cache)
  redis:
    image: redis:7-alpine
    container_name: openworkflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
